<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FPC 订单结算单</title>
<style>
  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --fg: #1A2027;
    --fg-2: #4A5562;
    --border: #E2E6EB;
    --border-strong: #C9D0D9;
    --accent: #2C6ED5;
    --accent-hover: #2460BD;
    --accent-weak: #EAF1FB;
    --print-border: #CCCCCC;
    --success: #1F9D55;
    --danger: #D64545;
    --danger-weak: #FBEAEA;
    --shadow-sm: 0 1px 2px rgba(26, 32, 39, 0.04), 0 4px 8px rgba(26, 32, 39, 0.06);
    --shadow-md: 0 2px 4px rgba(26, 32, 39, 0.04), 0 8px 16px rgba(26, 32, 39, 0.08);
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --font-mono: "SFMono-Regular", "JetBrains Mono", "Roboto Mono", Consolas, "Liberation Mono", monospace;
    --motion-fast: 150ms;
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .app-title {
    font-size: 20px;
    font-weight: 590;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .app-subtitle {
    font-size: 13px;
    color: var(--fg-2);
    margin: 2px 0 0;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--fg);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: background-color var(--motion-fast) var(--ease-standard),
                border-color var(--motion-fast) var(--ease-standard),
                transform var(--motion-fast) var(--ease-standard);
  }
  .btn:hover { background: var(--accent-weak); border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  .btn-ghost {
    background: transparent;
    border-color: transparent;
    color: var(--fg-2);
  }
  .btn-ghost:hover { background: var(--bg); border-color: var(--border); color: var(--fg); }

  .btn svg { display: block; }

  .layout {
    display: grid;
    grid-template-columns: 58% 42%;
    gap: 20px;
    align-items: start;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
  }

  .panel-section { padding: 18px 18px 20px; }
  .panel-section + .panel-section { border-top: 1px solid var(--border); }

  .section-label {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-2);
    margin: 0 0 12px;
    font-weight: 590;
  }

  /* 税率 / 运费 设置行 */
  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 13px;
    color: var(--fg-2);
  }
  .input {
    height: 38px;
    padding: 0 12px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    background: var(--surface);
    color: var(--fg);
    font-size: 14px;
    font-family: inherit;
    transition: border-color var(--motion-fast) var(--ease-standard),
                box-shadow var(--motion-fast) var(--ease-standard);
  }
  .input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-weak);
  }
  .input-mono { font-family: var(--font-mono); text-align: right; }

  /* 明细表 */
  .line-head, .line-row {
    display: grid;
    grid-template-columns: 1fr 110px 110px 130px 40px;
    gap: 10px;
    align-items: center;
  }
  .line-head {
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--fg-2);
    padding: 0 2px 8px;
    border-bottom: 1px solid var(--border);
  }
  .line-head .num, .line-head .act { text-align: right; }

  .line-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }

  .line-row {
    padding: 2px;
    border-radius: var(--radius-md);
    transition: background-color var(--motion-fast) var(--ease-standard);
  }
  .line-row.invalid { background: var(--danger-weak); }
  .line-row.invalid .input { border-color: var(--danger); }

  .cell-num {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--fg-2);
    text-align: right;
    padding-right: 4px;
  }
  .cell-sub {
    font-family: var(--font-mono);
    font-size: 14px;
    text-align: right;
    padding-right: 4px;
    font-variant-numeric: tabular-nums;
  }
  .cell-sub.zero { color: var(--fg-2); }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    background: transparent;
    color: var(--fg-2);
    cursor: pointer;
    transition: background-color var(--motion-fast) var(--ease-standard),
                color var(--motion-fast) var(--ease-standard);
  }
  .icon-btn:hover { background: var(--danger-weak); color: var(--danger); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .add-row {
    margin-top: 14px;
    width: 100%;
    justify-content: center;
  }

  .row-error {
    grid-column: 1 / -1;
    font-size: 12px;
    color: var(--danger);
    padding: 2px 2px 0;
    display: none;
  }
  .line-row.invalid .row-error { display: block; }

  /* 右侧汇总卡 */
  .summary-card {
    position: sticky;
    top: 20px;
  }
  .summary-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    color: var(--fg-2);
    margin-bottom: 14px;
  }
  .summary-meta .doc-no { font-family: var(--font-mono); }

  .sum-table { width: 100%; border-collapse: collapse; }
  .sum-table td {
    padding: 7px 2px;
    font-size: 14px;
    border-bottom: 1px dashed var(--border);
  }
  .sum-table td.label { color: var(--fg-2); }
  .sum-table td.value {
    text-align: right;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .total-row {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 2px solid var(--border-strong);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .total-row .total-label { font-size: 15px; font-weight: 590; }
  .total-row .total-value {
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 590;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .summary-foot {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .summary-foot .btn { width: 100%; justify-content: center; }

  .empty-hint {
    color: var(--fg-2);
    font-size: 13px;
    padding: 18px 2px;
    text-align: center;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-md);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: var(--fg);
    color: #fff;
    padding: 10px 18px;
    border-radius: var(--radius-md);
    font-size: 13px;
    box-shadow: var(--shadow-md);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--motion-fast) var(--ease-standard),
                transform var(--motion-fast) var(--ease-standard);
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
    .summary-card { position: static; }
    .meta-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 560px) {
    .line-head, .line-row {
      grid-template-columns: 1fr 84px 84px 1fr 36px;
      gap: 6px;
    }
    .app { padding: 16px 12px 48px; }
  }

  /* ===== 打印：仅出结算单 ===== */
  @media print {
    @page { size: A4; margin: 16mm 14mm; }
    html, body { background: #fff; font-size: 12px; }
    .app { max-width: none; padding: 0; margin: 0; }
    .app-header, .toolbar,
    .panel:first-child .panel-section:first-child,
    .panel:first-child .panel-section:nth-child(2),
    .add-row, .line-head .act,
    .meta-grid, .field, .line-row .icon-btn, .row-error,
    .summary-foot, .toast { display: none !important; }

    .layout { display: block; }
    .panel { border: none; box-shadow: none; background: #fff; }
    .panel-section { padding: 0; border: none; }

    /* 打印时左侧录入面板只显示明细表头与行 */
    .line-head { border-bottom: 1px solid #000; padding-bottom: 6px; }
    .line-row { border-bottom: 1px solid var(--print-border); padding: 4px 0; }
    .line-row.invalid { background: #fff; }
    .line-row.invalid .input { border-color: var(--print-border); }
    .line-row .input { border: none; padding: 0; height: auto; background: #fff; }
    .line-list { margin-top: 0; }

    .summary-card { position: static; margin-top: 18px; }
    .summary-meta { display: flex; }
    .total-row { border-top: 2px solid #000; }
    .total-row .total-value { color: #000; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="app-header no-print">
      <div>
        <h1 class="app-title">FPC 订单结算单</h1>
        <p class="app-subtitle">录入明细后实时汇总，可导出 CSV 或直接打印 A4 结算单</p>
      </div>
      <div class="toolbar">
        <button class="btn btn-ghost" id="btnClear" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          清空
        </button>
        <button class="btn" id="btnExport" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          导出 CSV
        </button>
        <button class="btn btn-primary" id="btnPrint" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          打印结算单
        </button>
      </div>
    </header>

    <div class="layout">
      <!-- 左：录入 -->
      <section class="panel">
        <div class="panel-section no-print">
          <p class="section-label">结算参数</p>
          <div class="meta-grid">
            <div class="field">
              <label for="rateInput">税率（%）</label>
              <input class="input input-mono" id="rateInput" type="number" min="0" max="100" step="0.01" value="13" inputmode="decimal" />
            </div>
            <div class="field">
              <label for="shipInput">运费（元）</label>
              <input class="input input-mono" id="shipInput" type="number" min="0" step="0.01" value="0" inputmode="decimal" />
            </div>
          </div>
        </div>

        <div class="panel-section">
          <p class="section-label">订单明细</p>
          <div class="line-head">
            <span>条目名称</span>
            <span class="num">单价（元）</span>
            <span class="num">数量</span>
            <span class="num">小计（元）</span>
            <span class="act"></span>
          </div>
          <div class="line-list" id="lineList"></div>
          <button class="btn add-row" id="btnAdd" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            新增一行
          </button>
        </div>
      </section>

      <!-- 右：实时汇总 + 结算单预览 -->
      <aside class="panel summary-card">
        <div class="panel-section">
          <div class="summary-meta">
            <span>结算单预览</span>
            <span class="doc-no" id="docNo">No. —</span>
          </div>

          <table class="sum-table">
            <tbody>
              <tr><td class="label">开票日期</td><td class="value" id="sumDate">—</td></tr>
              <tr><td class="label">有效明细行</td><td class="value" id="sumRows">0</td></tr>
            </tbody>
          </table>

          <div class="total-row">
            <span class="total-label">应付合计</span>
            <span class="total-value" id="sumTotal">0.00</span>
          </div>

          <div class="summary-foot no-print">
            <button class="btn" id="btnExport2" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              导出 CSV
            </button>
            <button class="btn btn-primary" id="btnPrint2" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              打印结算单
            </button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "fpc_draft_v1";

  // ---------- 工具函数 ----------
  function parseNum(raw) {
    if (raw === null || raw === undefined) return NaN;
    var s = String(raw).trim();
    if (s === "") return NaN;
    var n = Number(s);
    return isFinite(n) ? n : NaN;
  }

  // 避免浮点误差：以分为单位做整数运算后再转回元
  function round2(num) {
    // 加 1e-9 消除 -0 与极小值噪声，再四舍五入到分
    return Math.round((num + Number.EPSILON) * 100) / 100;
  }

  function fmt(n) {
    if (!isFinite(n)) n = 0;
    return n.toFixed(2);
  }

  function todayStr() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function genDocNo() {
    var d = new Date();
    var p = function (x) { return String(x).padStart(2, "0"); };
    var rand = String(Math.floor(Math.random() * 9000) + 1000);
    return "FPC" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + rand;
  }

  // ---------- 状态 ----------
  var lines = [];   // {id, name, price, qty}
  var seq = 0;
  var docNo = genDocNo();

  // ---------- DOM ----------
  var lineList = document.getElementById("lineList");
  var rateInput = document.getElementById("rateInput");
  var shipInput = document.getElementById("shipInput");
  var sumTotal = document.getElementById("sumTotal");
  var sumRows = document.getElementById("sumRows");
  var sumDate = document.getElementById("sumDate");
  var docNoEl = document.getElementById("docNo");
  var toastEl = document.getElementById("toast");

  function uid() { return "L" + (++seq); }

  function addLine(name, price, qty) {
    lines.push({ id: uid(), name: name || "", price: price || "", qty: qty || "" });
  }

  function renderLines() {
    lineList.innerHTML = "";
    if (lines.length === 0) {
      var hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "暂无明细，点击“新增一行”开始录入";
      lineList.appendChild(hint);
      return;
    }
    lines.forEach(function (line) {
      var row = document.createElement("div");
      row.className = "line-row";
      row.dataset.id = line.id;

      var nameCell = document.createElement("input");
      nameCell.className = "input";
      nameCell.type = "text";
      nameCell.placeholder = "如：FPC 双面板 10x10cm";
      nameCell.value = line.name;
      nameCell.addEventListener("input", function () { line.name = nameCell.value; saveDraft(); recompute(); });

      var priceCell = document.createElement("input");
      priceCell.className = "input input-mono";
      priceCell.type = "number";
      priceCell.min = "0";
      priceCell.step = "0.01";
      priceCell.inputMode = "decimal";
      priceCell.placeholder = "0.00";
      priceCell.value = line.price;
      priceCell.addEventListener("input", function () { line.price = priceCell.value; saveDraft(); recompute(); });

      var qtyCell = document.createElement("input");
      qtyCell.className = "input input-mono";
      qtyCell.type = "number";
      qtyCell.min = "0";
      qtyCell.step = "1";
      qtyCell.inputMode = "decimal";
      qtyCell.placeholder = "0";
      qtyCell.value = line.qty;
      qtyCell.addEventListener("input", function () { line.qty = qtyCell.value; saveDraft(); recompute(); });

      var subCell = document.createElement("div");
      subCell.className = "cell-sub";

      var delBtn = document.createElement("button");
      delBtn.className = "icon-btn";
      delBtn.type = "button";
      delBtn.setAttribute("aria-label", "删除该行");
      delBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
      delBtn.addEventListener("click", function () {
        lines = lines.filter(function (l) { return l.id !== line.id; });
        saveDraft();
        renderLines();
        recompute();
      });

      var err = document.createElement("div");
      err.className = "row-error";
      err.textContent = "单价或数量无效（需为大于 0 的数字）";

      row.appendChild(nameCell);
      row.appendChild(priceCell);
      row.appendChild(qtyCell);
      row.appendChild(subCell);
      row.appendChild(delBtn);
      row.appendChild(err);

      lineList.appendChild(row);
      line._refs = { row: row, sub: subCell, price: priceCell, qty: qtyCell, err: err };
    });
  }

  // ---------- 计算 ----------
  function compute() {
    var rate = parseNum(rateInput.value);
    if (!isFinite(rate) || rate < 0) rate = 0;
    var ship = parseNum(shipInput.value);
    if (!isFinite(ship) || ship < 0) ship = 0;

    var validCount = 0;
    var taxableBase = 0; // 不含运费
    var perLine = [];

    lines.forEach(function (line) {
      var price = parseNum(line.price);
      var qty = parseNum(line.qty);
      var ok = isFinite(price) && isFinite(qty) && price > 0 && qty > 0;
      if (line._refs) {
        if (ok) {
          line._refs.row.classList.remove("invalid");
        } else {
          line._refs.row.classList.add("invalid");
        }
      }
      if (ok) {
        var sub = round2(price * qty);
        perLine.push({ name: line.name, price: price, qty: qty, sub: sub });
        taxableBase += sub;
        validCount++;
        if (line._refs) {
          line._refs.sub.textContent = fmt(sub);
          line._refs.sub.classList.remove("zero");
        }
      } else {
        if (line._refs) {
          line._refs.sub.textContent = "—";
          line._refs.sub.classList.add("zero");
        }
      }
    });

    taxableBase = round2(taxableBase);
    var tax = round2(taxableBase * (rate / 100));
    var total = round2(taxableBase + tax + ship);

    return {
      rate: rate, ship: ship, validCount: validCount,
      taxableBase: taxableBase, tax: tax, total: total, perLine: perLine
    };
  }

  function recompute() {
    var r = compute();
    sumTotal.textContent = fmt(r.total);
    sumRows.textContent = String(r.validCount);
    sumDate.textContent = todayStr();
    docNoEl.textContent = "No. " + docNo;
  }

  // ---------- CSV 导出 ----------
  function csvCell(v) {
    var s = String(v == null ? "" : v);
    if (/[",\n]/.test(s)) {
      s = '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  function exportCSV() {
    var r = compute();
    if (r.validCount === 0) {
      showToast("没有有效明细行，无法导出");
      return;
    }
    var rows = [];
    rows.push(["FPC 订单结算单"]);
    rows.push(["单据编号", docNo]);
    rows.push(["开票日期", todayStr()]);
    rows.push(["税率(%)", fmt(r.rate)]);
    rows.push(["运费(元)", fmt(r.ship)]);
    rows.push([]);
    rows.push(["条目名称", "单价(元)", "数量", "小计(元)"]);
    r.perLine.forEach(function (p) {
      rows.push([p.name, fmt(p.price), fmt(p.qty), fmt(p.sub)]);
    });
    rows.push([]);
    rows.push(["应税基数(元)", fmt(r.taxableBase)]);
    rows.push(["税额(元)", fmt(r.tax)]);
    rows.push(["应付合计(元)", fmt(r.total)]);

    var csv = rows.map(function (row) {
      return row.map(csvCell).join(",");
    }).join("\r\n");

    // BOM 保证 Excel 正确识别 UTF-8
    var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "FPC结算单_" + docNo + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast("已导出 CSV");
  }

  // ---------- 草稿 ----------
  function saveDraft() {
    try {
      var data = {
        docNo: docNo,
        rate: rateInput.value,
        ship: shipInput.value,
        lines: lines.map(function (l) { return { name: l.name, price: l.price, qty: l.qty }; })
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { /* 隐私模式等场景忽略 */ }
  }

  function loadDraft() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      var data = JSON.parse(raw);
      if (!data || !Array.isArray(data.lines)) return false;
      docNo = data.docNo || docNo;
      if (data.rate !== undefined) rateInput.value = data.rate;
      if (data.ship !== undefined) shipInput.value = data.ship;
      lines = [];
      data.lines.forEach(function (l) { addLine(l.name, l.price, l.qty); });
      return true;
    } catch (e) { return false; }
  }

  function clearAll() {
    if (!confirm("确定清空所有明细与参数？此操作不可撤销。")) return;
    lines = [];
    rateInput.value = "13";
    shipInput.value = "0";
    docNo = genDocNo();
    saveDraft();
    renderLines();
    recompute();
    showToast("已清空");
  }

  // ---------- Toast ----------
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
  }

  // ---------- 事件绑定 ----------
  document.getElementById("btnAdd").addEventListener("click", function () {
    addLine("", "", "");
    saveDraft();
    renderLines();
    recompute();
    // 聚焦最后一行名称
    var last = lineList.querySelector(".line-row:last-child input");
    if (last) last.focus();
  });
  document.getElementById("btnExport").addEventListener("click", exportCSV);
  document.getElementById("btnExport2").addEventListener("click", exportCSV);
  document.getElementById("btnPrint").addEventListener("click", function () { window.print(); });
  document.getElementById("btnPrint2").addEventListener("click", function () { window.print(); });
  document.getElementById("btnClear").addEventListener("click", clearAll);

  rateInput.addEventListener("input", function () { saveDraft(); recompute(); });
  shipInput.addEventListener("input", function () { saveDraft(); recompute(); });

  // ---------- 初始化 ----------
  if (!loadDraft() || lines.length === 0) {
    // 默认给两行示例（非占位 AI 文案，是真实 FPC 业务条目）
    addLine("FPC 软板 4层 0.15mm", "5.00", "100");
    addLine("FPC 补强钢片 20x8mm", "0.30", "200");
  }
  renderLines();
  recompute();

  // 暴露给自检（可选）
  window.__fpc = { compute: compute, parseNum: parseNum, round2: round2, fmt: fmt };
})();
</script>
</body>
</html>
